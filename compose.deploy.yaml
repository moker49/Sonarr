name: sonarr-composite
services:
  sonarr:
    image: "${SONARR_IMAGE:-sonarr-composite:local}"
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    ports:
      - "${SONARR_PORT:-8989}:8989"
    environment:
      TZ: "${TZ:-America/New_York}"
    volumes:
      - config:/config
      - type: bind
        source: "${media_root:?Set media_root in .env to the destination TV folder}"
        target: /tv
        bind:
          create_host_path: false
      - type: bind
        source: "${downloads:?Set downloads in .env to the destination completed-download parent folder}"
        target: /downloads
        bind:
          create_host_path: false

volumes:
  config:
